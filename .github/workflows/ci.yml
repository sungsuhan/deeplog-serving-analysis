# CI — 저장소 품질 자동 검사 (CLAUDE.md §현재 스코프 "병행 항목: CI/CD").
#
# 이 워크플로는 벤치마크를 돌리지 않고 성능 수치를 만들지 않는다. GitHub 러너에는
# GPU가 없고, 공식 측정은 EC2 g4dn.xlarge에서만 한다(CLAUDE.md 핵심 규칙).
# 실제 데이터·체크포인트도 저장소에 없으므로 소형 합성 데이터로 코드 경로만 검사한다.
#
#   static  — 파이썬 문법, 셸 스크립트 문법, docker-compose 데이터셋 전환 검사
#   smoke   — 합성 데이터 학습 → 패키징 → 세 프레임워크 기동 → 응답 스키마·값 일치
#   images  — 서빙 이미지 3종 빌드 (PR·푸시 모두, 레지스트리에는 올리지 않음)
#   publish — main 푸시에서 앞의 세 작업이 모두 통과했을 때만 서빙 이미지 3종을
#             GitHub Container Registry(ghcr.io)에 올린다(CD). 이미지에는 코드와
#             의존성만 들어가고 모델 가중치·데이터·.env는 들어가지 않는다(Dockerfile이
#             파일을 하나씩 COPY한다). 가중치는 지금처럼 실행 시 마운트한다.
#
# 러너는 ubuntu-latest 대신 버전을 고정한다 — latest가 새 OS로 넘어가면 코드 변경
# 없이도 CI 결과가 달라질 수 있다. 올릴 때는 의도적으로 바꾸고 결과를 확인한다.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # YAML 문법만으로는 못 잡는 워크플로 오류(허용되지 않는 컨텍스트 등)를 잡는다.
      # 다만 워크플로 자체가 무효면 이 단계도 돌지 못하므로, ci.yml을 고칠 때는
      # 로컬에서도 actionlint를 돌린다.
      - name: 워크플로 검사 (actionlint)
        run: |
          pip install actionlint-py==1.7.7.23
          actionlint -shellcheck=   # run: 셸 스타일 검사는 하지 않는다(문법은 다음 단계들이 본다)

      - name: Python 문법
        run: python -m py_compile $(git ls-files '*.py')

      - name: 셸 스크립트 문법
        run: |
          rc=0
          for f in $(git ls-files '*.sh'); do
            if bash -n "$f"; then echo "ok  $f"; else echo "FAIL $f"; rc=1; fi
          done
          exit $rc

      - name: docker-compose 데이터셋 전환 (DEEPLOG_DATASET)
        run: python ci/check_compose.py

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: static
    steps:
      - uses: actions/checkout@v5

      # Triton 서버 이미지가 압축 해제 후 15GB 안팎이라 기본 디스크로는 빠듯하다.
      # 이 작업에 쓰지 않는 사전 설치 도구를 지워 공간을 확보한다.
      - name: 디스크 공간 확보
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ci/requirements.txt

      - name: 의존성 설치 (torch는 CPU 빌드)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          pip install -r ci/requirements.txt

      - name: Triton 서버 이미지 받기
        run: docker pull nvcr.io/nvidia/tritonserver:24.08-py3

      # runner 컨텍스트는 job 수준 env에서 쓸 수 없어(워크플로 전체가 무효 처리됨)
      # step 수준에서 지정한다.
      - name: 스모크 검사
        env:
          CI_ROOT: ${{ runner.temp }}/deeplog-ci
        run: bash ci/smoke.sh

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: static
    steps:
      - uses: actions/checkout@v5

      # fastapi·bentoml 이미지는 CUDA 빌드 torch를 포함해 각각 수 GB다.
      - name: 디스크 공간 확보
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: 서빙 이미지 빌드 (fastapi, bentoml, triton-wrapper)
        run: docker compose -f docker/docker-compose.yml build fastapi bentoml triton-wrapper

  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [static, smoke, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: 디스크 공간 확보
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: ghcr.io 로그인
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # 태그: 커밋 SHA(어떤 코드로 만든 이미지인지 추적 — 실험에는 이 태그를 쓴다)와
      # latest(가장 최근 main). 이미지 이름은 deeplog-<프레임워크>.
      - name: 서빙 이미지 빌드·푸시 (fastapi, bentoml, triton-wrapper)
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          for fw in fastapi bentoml triton; do
            name="deeplog-$fw"
            [[ "$fw" == triton ]] && name="deeplog-triton-wrapper"
            img="ghcr.io/$owner/$name"
            docker build -f "serving/$fw/Dockerfile" \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              -t "$img:${{ github.sha }}" -t "$img:latest" .
            docker push "$img:${{ github.sha }}"
            docker push "$img:latest"
            docker image rm "$img:${{ github.sha }}" "$img:latest"   # 다음 이미지 빌드용 디스크 확보
            echo "pushed $img:${{ github.sha }}"
          done
