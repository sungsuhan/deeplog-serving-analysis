version: '3.8'
services:

  # ── Kafka 인프라 ─────────────────────────────────────────────────────────────
  # KRaft 모드: Zookeeper 없이 Kafka만으로 클러스터를 운영하는 최신 방식
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"   # 호스트(로컬/EC2)에서 접근할 때 사용
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      # 내부(컨테이너 간): PLAINTEXT://kafka:29092
      # 외부(호스트에서): PLAINTEXT_HOST://localhost:9092
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ML 서빙 스택 ──────────────────────────────────────────────────────────────
  fastapi:
    build:
      context: ..
      dockerfile: serving/fastapi/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../model/checkpoints:/workspace/model/checkpoints:ro
    environment:
      - DATASET=hdfs
      - CKPT_DIR=/workspace/model/checkpoints/hdfs
    # Triton과 동일하게 GPU로 추론하도록 (requirements.txt의 CUDA torch와 세트).
    # 이거 없이 CUDA torch만 설치하면 컨테이너 안에서 GPU가 안 보여
    # torch.cuda.is_available()이 여전히 False가 된다.
    gpus: all

  bentoml:
    build:
      context: ..
      dockerfile: serving/bentoml/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - bentoml_home:/root/bentoml
      - ../model/checkpoints:/workspace/model/checkpoints:ro
    environment:
      - BENTOML_MODEL_NAME=deeplog
      - BENTOML_MODEL_TAG=latest
    gpus: all

  triton:
    image: nvcr.io/nvidia/tritonserver:24.08-py3
    volumes:
      - ../serving/triton/models:/models
    ports:
      - "8001:8001"
    # Triton 기본 포트는 HTTP=8000/GRPC=8001/Metrics=8002이지만, 이 프로젝트는
    # .env.example·CLAUDE.md 전반에서 "8001 = Triton HTTP"로 문서화돼 있다.
    # 기본값 그대로 두면 8001이 GRPC가 되어 래퍼(tritonclient.http)가 붙지
    # 못하므로, HTTP를 8001로 명시 지정하고 GRPC/metrics는 충돌 없게 옮긴다.
    command: >
      tritonserver --model-repository=/models
      --http-port=8001 --grpc-port=8003 --metrics-port=8004
    # `deploy.resources.reservations.devices`(Swarm 지향 문법)는 Docker Desktop
    # WSL2 백엔드에서 "nvml error: not supported: unknown"로 실패했다.
    # `gpus:` 축약 문법은 `docker run --gpus all`과 동일 경로를 타 로컬에서
    # 확인됐고, 네이티브 Linux Docker Engine(EC2)에서도 동일하게 지원된다.
    gpus: all

  triton-wrapper:
    build:
      context: ..
      dockerfile: serving/triton/Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ../serving/triton/models:/workspace/serving/triton/models:ro
    environment:
      - TRITON_URL=triton:8001
      - MODEL_NAME=deeplog
      - MODEL_REPO=/workspace/serving/triton/models
    depends_on:
      - triton

volumes:
  bentoml_home:
